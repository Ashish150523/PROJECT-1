<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome</title>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Montserrat:wght@200;300;400;500;600;700&display=swap');

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,0.06), transparent 30%),
        radial-gradient(circle at 80% 70%, rgba(255,255,255,0.04), transparent 35%),
        #090909;

      color: white;
      font-family: "Montserrat", sans-serif;
    }

    /* =================================
       FULL PAGE
    ================================= */

    .welcome-page {
      width: 100vw;
      height: 100vh;
      position: relative;
      overflow: hidden;
    }

    /* =================================
       OPTION WHEEL
    ================================= */

    .option-wheel {
      position: absolute;
      inset: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      cursor: grab;
      user-select: none;
      touch-action: none;
      outline: none;
    }

    .option-wheel.dragging {
      cursor: grabbing;
    }

    /* =================================
       WHEEL OPTIONS
    ================================= */

    .option-wheel__item {
      position: absolute;
      top: 50%;
      left: 8vw;

      border: none;
      background: transparent;

      color: rgba(255,255,255,0.32);

      font-family: "Montserrat", sans-serif;

      font-size: clamp(65px, 8vw, 150px);
      font-weight: 200;

      line-height: 1;
      letter-spacing: -4px;

      white-space: nowrap;
      text-align: left;

      padding: 15px 25px;

      cursor: pointer;

      transform-origin: left center;

      will-change: transform, opacity, filter;

      transition:
        color 0.3s ease,
        font-weight 0.3s ease,
        letter-spacing 0.3s ease,
        text-shadow 0.3s ease;
    }

    .option-wheel__item:hover {
      color: rgba(255,255,255,0.85) !important;
      letter-spacing: 2px;
    }

    .option-wheel__item.selected {
      color: #ffffff;
      font-weight: 600;

      text-shadow:
        0 0 40px rgba(255,255,255,0.12);
    }

    /* =================================
       ONLY WELCOME HAS GLASS EFFECT
    ================================= */

    .welcome-glass {
      position: absolute;

      top: 35px;
      right: 45px;

      z-index: 20;

      padding: 14px 22px;

      border-radius: 18px;

      /* Glass */
      background: rgba(255, 255, 255, 0.07);

      border:
        1px solid
        rgba(255, 255, 255, 0.18);

      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      box-shadow:
        0 10px 35px rgba(0,0,0,0.25),
        inset 0 1px 0 rgba(255,255,255,0.16);

      overflow: hidden;
    }

    /* Glass shine */

    .welcome-glass::before {
      content: "";

      position: absolute;

      top: 0;
      left: 0;

      width: 100%;
      height: 50%;

      background:
        linear-gradient(
          135deg,
          rgba(255,255,255,0.18),
          transparent 70%
        );

      pointer-events: none;
    }

    .welcome-text {
      position: relative;
      z-index: 1;

      font-family: "DM Mono", monospace;

      font-size: 13px;
      font-weight: 500;

      letter-spacing: 7px;
      text-transform: uppercase;

      color: rgba(255,255,255,0.85);
    }

    /* =================================
       MOBILE
    ================================= */

    @media (max-width: 800px) {

      .option-wheel__item {
        left: 30px;
        font-size: clamp(50px, 11vw, 100px);
      }

      .welcome-glass {
        top: 25px;
        right: 25px;

        padding: 11px 16px;

        border-radius: 14px;
      }

      .welcome-text {
        font-size: 10px;
        letter-spacing: 4px;
      }
    }

  </style>
</head>

<body>

  <main class="welcome-page">

    <!-- =============================
         OPTION WHEEL
    ============================== -->

    <div
      class="option-wheel"
      id="optionWheel"
      tabindex="0"
      aria-label="Select an option"
    ></div>


    <!-- =============================
         ONLY WELCOME HAS GLASS EFFECT
    ============================== -->

    <div class="welcome-glass">

      <div class="welcome-text">
        Welcome
      </div>

    </div>

  </main>


  <script>

    /* =================================
       OPTIONS
    ================================= */

    const items = [
      "🏆CODERUN",
      "🙋‍♂️ATTENDENCE",
      "</>COMPILER",
      "🎵MUSIC",
      "📝NOTES",
      "🌐IMP WEB PAGES"
    ];


    /* =================================
       PAGES
    ================================= */

    const pages = {
      "🏆CODERUN": "coderun.html",
      "🙋‍♂️ATTENDENCE": "attendence.html",
      "</>COMPILER": "compiler.html",
      "🎵MUSIC": "music.html",
      "📝NOTES": "notes.html",
      "🌐IMP WEB PAGES": "imp-web-pages.html"
    };


    /* =================================
       SETTINGS
    ================================= */

    const defaultSelected = 2;

    const spacing = 1.55;
    const curve = 1.2;
    const tilt = 5;

    const blur = 2.5;
    const fade = 0.17;

    const minOpacity = 0.04;

    /*
      Higher number = smoother/slower movement
    */
    const smoothing = 420;


    /* =================================
       GET WHEEL
    ================================= */

    const wheel =
      document.getElementById("optionWheel");


    /* =================================
       CREATE OPTIONS
    ================================= */

    const itemElements = [];

    items.forEach((item, index) => {

      const button =
        document.createElement("button");

      button.className =
        "option-wheel__item";

      button.type = "button";

      button.textContent = item;


      if (index === defaultSelected) {
        button.classList.add("selected");
      }


      /* CLICK → OPEN PAGE */

      button.addEventListener(
        "click",
        function () {

          if (dragMoved) return;

          window.location.href =
            pages[item];

        }
      );


      wheel.appendChild(button);

      itemElements.push(button);

    });


    /* =================================
       WHEEL VARIABLES
    ================================= */

    let position =
      defaultSelected;

    let target =
      defaultSelected;

    let selectedIndex =
      defaultSelected;

    let lastTime =
      performance.now();

    let animationFrame =
      null;

    let wheelTimer =
      null;


    /* =================================
       GET ROW HEIGHT
    ================================= */

    function getRowHeight() {

      const item =
        itemElements[0];

      const actualFontSize =
        parseFloat(
          getComputedStyle(item).fontSize
        );

      return actualFontSize * spacing;

    }


    /* =================================
       UPDATE SELECTED
    ================================= */

    function updateSelected(index) {

      selectedIndex = index;

      itemElements.forEach(
        function(element, itemIndex) {

          element.classList.toggle(
            "selected",
            itemIndex === index
          );

        }
      );

    }


    /* =================================
       SET TARGET
    ================================= */

    function setTarget(
      value,
      snap = false
    ) {

      let newValue =
        Math.min(
          Math.max(value, 0),
          items.length - 1
        );


      if (snap) {
        newValue =
          Math.round(newValue);
      }


      target = newValue;


      const index =
        Math.max(
          0,
          Math.min(
            Math.round(newValue),
            items.length - 1
          )
        );


      if (index !== selectedIndex) {
        updateSelected(index);
      }


      startAnimation();

    }


    /* =================================
       SMOOTH ANIMATION
    ================================= */

    function animate(now) {

      const dt =
        Math.min(
          (now - lastTime) / 1000,
          0.05
        );

      lastTime = now;


      /*
        Exponential smoothing.
        This makes the wheel smooth
        on different screen frame rates.
      */

      const tau =
        smoothing / 1000;

      const speed =
        1 -
        Math.exp(-dt / tau);


      let next =
        position +
        (target - position) * speed;


      const settled =
        Math.abs(target - next) <
        0.0005;


      if (settled) {
        next = target;
      }


      position = next;


      const rowHeight =
        getRowHeight();


      const tiltRad =
        (tilt * Math.PI) / 180;


      const radius =
        rowHeight / tiltRad;


      /* UPDATE ALL OPTIONS */

      itemElements.forEach(
        function(element, index) {

          const distance =
            index - position;

          const absoluteDistance =
            Math.abs(distance);


          const angle =
            Math.max(
              -Math.PI / 2,
              Math.min(
                Math.PI / 2,
                distance * tiltRad
              )
            );


          /* CURVED WHEEL POSITION */

          const y =
            radius *
            Math.sin(angle);


          const x =
            -radius *
            (
              1 - Math.cos(angle)
            ) *
            curve;


          const rotation =
            (angle * 180) /
            Math.PI;


          /* MOVE SMOOTHLY */

          element.style.transform =
            `translate3d(
              ${x.toFixed(2)}px,
              calc(${y.toFixed(2)}px - 50%),
              0
            )
            rotate(${rotation.toFixed(2)}deg)`;


          /* OPACITY */

          element.style.opacity =
            Math.max(
              minOpacity,
              1 -
              absoluteDistance * fade
            );


          /* BLUR */

          element.style.filter =
            `blur(${(
              absoluteDistance * blur
            ).toFixed(2)}px)`;

        }
      );


      /* KEEP ANIMATING UNTIL STOPPED */

      if (!settled) {

        animationFrame =
          requestAnimationFrame(animate);

      } else {

        animationFrame = null;

      }

    }


    /* =================================
       START ANIMATION
    ================================= */

    function startAnimation() {

      if (animationFrame !== null) {

        cancelAnimationFrame(
          animationFrame
        );

      }


      lastTime =
        performance.now();


      animationFrame =
        requestAnimationFrame(animate);

    }


    /* =================================
       MOUSE WHEEL
    ================================= */

    wheel.addEventListener(
      "wheel",
      function(event) {

        event.preventDefault();


        const rowHeight =
          getRowHeight();


        /*
          Smaller movement gives
          smoother scrolling.
        */

        const movement =
          event.deltaY /
          (rowHeight * 1.5);


        const step =
          Math.max(
            -0.8,
            Math.min(
              0.8,
              movement
            )
          );


        setTarget(
          target + step,
          false
        );


        clearTimeout(wheelTimer);


        wheelTimer =
          setTimeout(
            function() {

              /* Smooth snap */

              setTarget(
                target,
                true
              );

            },
            180
          );

      },
      {
        passive: false
      }
    );


    /* =================================
       DRAG VARIABLES
    ================================= */

    let dragging = false;
    let dragMoved = false;

    let startY = 0;
    let startTarget = 0;


    /* =================================
       START DRAG
    ================================= */

    wheel.addEventListener(
      "pointerdown",
      function(event) {

        dragging = true;
        dragMoved = false;

        startY =
          event.clientY;

        startTarget =
          target;


        wheel.classList.add(
          "dragging"
        );

      }
    );


    /* =================================
       SMOOTH DRAG
    ================================= */

    wheel.addEventListener(
      "pointermove",
      function(event) {

        if (!dragging) return;


        const difference =
          event.clientY - startY;


        if (
          Math.abs(difference) > 5
        ) {

          dragMoved = true;

        }


        if (dragMoved) {

          const rowHeight =
            getRowHeight();


          /*
            Lower sensitivity makes
            dragging smoother.
          */

          setTarget(
            startTarget -
            difference / (rowHeight * 1.15),
            false
          );

        }

      }
    );


    /* =================================
       STOP DRAG
    ================================= */

    function stopDragging() {

      if (!dragging) return;


      dragging = false;


      wheel.classList.remove(
        "dragging"
      );


      if (dragMoved) {

        /*
          Smoothly snap to nearest option
        */

        setTarget(
          target,
          true
        );


        setTimeout(
          function() {

            dragMoved = false;

          },
          180
        );

      }

    }


    wheel.addEventListener(
      "pointerup",
      stopDragging
    );


    wheel.addEventListener(
      "pointercancel",
      stopDragging
    );


    /* =================================
       KEYBOARD
    ================================= */

    wheel.addEventListener(
      "keydown",
      function(event) {

        if (
          event.key === "ArrowUp" ||
          event.key === "ArrowLeft"
        ) {

          event.preventDefault();

          setTarget(
            Math.round(target) - 1,
            true
          );

        }


        if (
          event.key === "ArrowDown" ||
          event.key === "ArrowRight"
        ) {

          event.preventDefault();

          setTarget(
            Math.round(target) + 1,
            true
          );

        }

      }
    );


    /* =================================
       INITIAL START
    ================================= */

    setTarget(
      defaultSelected,
      true
    );

  </script>

</body>
</html>
