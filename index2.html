<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            font-family: Arial, Helvetica, sans-serif;
            background: #000;
            color: white;
        }

        /* ================================
           INFINITE GRID MENU CANVAS
        ================================= */

        #infinite-grid-menu-canvas {
            cursor: grab;
            width: 100%;
            height: 100%;
            overflow: hidden;
            position: relative;
            outline: none;
            display: block;
            touch-action: none;
        }

        #infinite-grid-menu-canvas:active {
            cursor: grabbing;
        }

        /* ================================
           PAGE
        ================================= */

        .welcome-page {
            position: relative;
            width: 100%;
            height: 100vh;
            overflow: hidden;
            background:
                radial-gradient(circle at 50% 50%,
                    #20104a 0%,
                    #0b1022 45%,
                    #000 100%);
        }

        /* Dark overlay */

        .overlay {
            position: absolute;
            inset: 0;
            z-index: 2;
            pointer-events: none;
            background:
                linear-gradient(
                    90deg,
                    rgba(0, 0, 0, 0.78) 0%,
                    rgba(0, 0, 0, 0.15) 50%,
                    rgba(0, 0, 0, 0.55) 100%
                );
        }

        /* ================================
           LEFT WELCOME CONTENT
        ================================= */

        .welcome-content {
            position: absolute;
            z-index: 5;
            left: 8%;
            top: 50%;
            transform: translateY(-50%);
            max-width: 650px;
            pointer-events: none;
        }

        .small-title {
            color: #a78bfa;
            font-size: 0.8rem;
            letter-spacing: 5px;
            margin-bottom: 25px;
            font-weight: bold;
        }

        .welcome-content h1 {
            font-size: clamp(3.5rem, 8vw, 8rem);
            line-height: 0.9;
            font-weight: 900;
            letter-spacing: -5px;
            margin-bottom: 30px;
        }

        .welcome-content h1 span {
            display: block;
            color: transparent;
            -webkit-text-stroke: 2px #8b5cf6;
        }

        .welcome-description {
            max-width: 500px;
            color: #b4b4c8;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* ================================
           START BUTTON
        ================================= */

        .start-button {
            pointer-events: auto;
            border: none;
            background: #5227ff;
            color: white;
            padding: 17px 30px;
            font-size: 0.8rem;
            font-weight: 800;
            letter-spacing: 2px;
            cursor: pointer;
            transition: 0.3s ease;
            border-radius: 4px;
        }

        .start-button span {
            margin-left: 20px;
            font-size: 1.3rem;
        }

        .start-button:hover {
            background: white;
            color: #5227ff;
            transform: translateY(-5px);
            box-shadow: 0 15px 50px rgba(82, 39, 255, 0.5);
        }

        /* ================================
           ACTIVE FACE TITLE
        ================================= */

        .face-title {
            user-select: none;
            position: absolute;
            z-index: 10;
            font-weight: 900;
            font-size: 3rem;
            left: 1.6em;
            top: 50%;
        }

        .face-title {
            position: absolute;
            top: 50%;
            transform: translate(20%, -50%);
        }

        .face-title.active {
            opacity: 1;
            transform: translate(20%, -50%);
            pointer-events: auto;
            transition: 0.5s ease;
        }

        .face-title.inactive {
            pointer-events: none;
            opacity: 0;
            transition: 0.1s ease;
        }

        /* ================================
           FACE DESCRIPTION
        ================================= */

        .face-description {
            user-select: none;
            position: absolute;
            z-index: 10;
            max-width: 10ch;
            top: 50%;
            font-size: 1.2rem;
            right: 1%;
            transform: translate(0, -50%);
        }

        .face-description.active {
            opacity: 1;
            transform: translate(-90%, -50%);
            pointer-events: auto;
            transition: 0.5s ease;
        }

        .face-description.inactive {
            pointer-events: none;
            transform: translate(-60%, -50%);
            opacity: 0;
            transition: 0.1s ease;
        }

        /* ================================
           ROUND ACTION BUTTON
        ================================= */

        .action-button {
            position: absolute;
            left: 50%;
            z-index: 10;
            width: 60px;
            height: 60px;
            display: grid;
            place-items: center;
            background: #5227ff;
            border: none;
            border-radius: 50%;
            cursor: pointer;
            border: 5px solid #000;
        }

        .action-button-icon {
            user-select: none;
            position: relative;
            color: #fff;
            top: 2px;
            font-size: 26px;
        }

        .action-button.active {
            bottom: 3.8em;
            transform: translateX(-50%) scale(1);
            opacity: 1;
            pointer-events: auto;
            transition: 0.5s ease;
        }

        .action-button.inactive {
            bottom: -80px;
            transform: translateX(-50%) scale(0);
            opacity: 0;
            pointer-events: none;
            transition: 0.1s ease;
        }

        /* ================================
           BOTTOM DRAG HINT
        ================================= */

        .drag-hint {
            position: absolute;
            z-index: 8;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            color: #aaa;
            font-size: 0.7rem;
            letter-spacing: 3px;
            pointer-events: none;
            animation: floatHint 2s infinite ease-in-out;
        }

        @keyframes floatHint {
            0%, 100% {
                transform: translateX(-50%) translateY(0);
                opacity: 0.5;
            }

            50% {
                transform: translateX(-50%) translateY(7px);
                opacity: 1;
            }
        }

        @media (max-width: 1500px) {
            .face-title,
            .face-description {
                display: none;
            }
        }

        @media (max-width: 768px) {

            .welcome-content {
                left: 30px;
                right: 30px;
                top: 42%;
            }

            .welcome-content h1 {
                letter-spacing: -2px;
            }

            .welcome-description {
                font-size: 0.95rem;
            }

            .small-title {
                font-size: 0.65rem;
                letter-spacing: 3px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome-page">

        <!-- INTERACTIVE CANVAS -->
        <canvas id="infinite-grid-menu-canvas"></canvas>

        <!-- DARK OVERLAY -->
        <div class="overlay"></div>

        <!-- MAIN CONTENT -->
        <div class="welcome-content">

            <p class="small-title">
                ✦ WELCOME TO THE FUTURE ✦
            </p>

            <h1>
                YOUR JOURNEY
                <span>STARTS HERE</span>
            </h1>

            <p class="welcome-description">
                Drag the interactive image sphere and explore a world
                of possibilities. Your journey starts here.
            </p>

            <button class="start-button" onclick="goNext()">
                GET STARTED
                <span>→</span>
            </button>

        </div>

        <!-- ACTIVE ITEM TITLE -->
        <h2 id="faceTitle" class="face-title active">
            WELCOME
        </h2>

        <!-- ACTIVE ITEM DESCRIPTION -->
        <p id="faceDescription" class="face-description active">
            Explore the experience
        </p>

        <!-- ROUND BUTTON -->
        <button
            id="actionButton"
            class="action-button active"
            onclick="goNext()"
        >
            <span class="action-button-icon">↗</span>
        </button>

        <!-- HINT -->
        <div class="drag-hint">
            DRAG THE SPHERE TO EXPLORE
        </div>

    </div>


    <script>

        /* ==========================================
           CANVAS SETUP
        ========================================== */

        const canvas = document.getElementById(
            "infinite-grid-menu-canvas"
        );

        const ctx = canvas.getContext("2d");

        let width;
        let height;

        let rotationX = 0;
        let rotationY = 0;

        let velocityX = 0;
        let velocityY = 0;

        let isDragging = false;

        let previousX = 0;
        let previousY = 0;


        /* ==========================================
           MENU ITEMS
        ========================================== */

        const items = [
            {
                title: "WELCOME",
                description: "Explore the experience",
                image:
                "https://images.unsplash.com/photo-1519608487953-e999c86e7455?q=80&w=600&auto=format"
            },
            {
                title: "DISCOVER",
                description: "Find something amazing",
                image:
                "https://images.unsplash.com/photo-1500530855697-b586d89ba3ee?q=80&w=600&auto=format"
            },
            {
                title: "EXPLORE",
                description: "A new world awaits you",
                image:
                "https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?q=80&w=600&auto=format"
            },
            {
                title: "CREATE",
                description: "Turn ideas into reality",
                image:
                "https://images.unsplash.com/photo-1462331940025-496dfbfc7564?q=80&w=600&auto=format"
            },
            {
                title: "CONNECT",
                description: "Connect with the future",
                image:
                "https://images.unsplash.com/photo-1500534623283-312aade485b7?q=80&w=600&auto=format"
            },
            {
                title: "START",
                description: "Begin your journey now",
                image:
                "https://images.unsplash.com/photo-1446776811953-b23d57bd21aa?q=80&w=600&auto=format"
            }
        ];


        /* ==========================================
           LOAD IMAGES
        ========================================== */

        const loadedImages = [];

        let loadedCount = 0;

        items.forEach((item, index) => {

            const image = new Image();

            image.crossOrigin = "anonymous";

            image.onload = function() {
                loadedCount++;

                if (loadedCount === items.length) {
                    animate();
                }
            };

            image.src = item.image;

            loadedImages[index] = image;
        });


        /* ==========================================
           RESIZE CANVAS
        ========================================== */

        function resizeCanvas() {

            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        resizeCanvas();

        window.addEventListener(
            "resize",
            resizeCanvas
        );


        /* ==========================================
           3D ROTATION FUNCTION
        ========================================== */

        function rotatePoint(x, y, z) {

            /* Rotate around Y axis */

            let cosY = Math.cos(rotationY);
            let sinY = Math.sin(rotationY);

            let x1 = x * cosY - z * sinY;
            let z1 = x * sinY + z * cosY;


            /* Rotate around X axis */

            let cosX = Math.cos(rotationX);
            let sinX = Math.sin(rotationX);

            let y1 = y * cosX - z1 * sinX;
            let z2 = y * sinX + z1 * cosX;

            return {
                x: x1,
                y: y1,
                z: z2
            };
        }


        /* ==========================================
           CREATE SPHERE POSITIONS
        ========================================== */

        function getSpherePoints(count) {

            const points = [];

            const goldenAngle =
                Math.PI * (3 - Math.sqrt(5));

            for (let i = 0; i < count; i++) {

                const y =
                    1 - (i / (count - 1)) * 2;

                const radius =
                    Math.sqrt(1 - y * y);

                const theta =
                    goldenAngle * i;

                const x =
                    Math.cos(theta) * radius;

                const z =
                    Math.sin(theta) * radius;

                points.push({
                    x: x,
                    y: y,
                    z: z,
                    itemIndex: i % items.length
                });
            }

            return points;
        }


        const spherePoints = getSpherePoints(42);


        /* ==========================================
           UPDATE ACTIVE ITEM
        ========================================== */

        let currentActiveIndex = 0;


        function updateActiveItem(index) {

            if (index === currentActiveIndex) return;

            currentActiveIndex = index;

            const title =
                document.getElementById("faceTitle");

            const description =
                document.getElementById("faceDescription");


            title.classList.remove("active");
            title.classList.add("inactive");

            description.classList.remove("active");
            description.classList.add("inactive");


            setTimeout(() => {

                title.textContent =
                    items[index].title;

                description.textContent =
                    items[index].description;


                title.classList.remove("inactive");
                title.classList.add("active");

                description.classList.remove("inactive");
                description.classList.add("active");

            }, 150);
        }


        /* ==========================================
           DRAW SPHERE
        ========================================== */

        function drawSphere() {

            ctx.clearRect(
                0,
                0,
                width,
                height
            );


            const centerX =
                width * 0.70;

            const centerY =
                height * 0.50;


            let radius =
                Math.min(width, height) * 0.32;


            if (width < 768) {

                radius =
                    Math.min(width, height) * 0.38;
            }


            const projected = [];


            spherePoints.forEach(point => {

                const rotated =
                    rotatePoint(
                        point.x,
                        point.y,
                        point.z
                    );


                const perspective =
                    1.6 / (2.8 - rotated.z);


                projected.push({
                    x:
                        centerX +
                        rotated.x *
                        radius *
                        perspective,

                    y:
                        centerY +
                        rotated.y *
                        radius *
                        perspective,

                    z: rotated.z,

                    scale: perspective,

                    itemIndex:
                        point.itemIndex
                });
            });


            /* Draw back images first */

            projected.sort(
                (a, b) => a.z - b.z
            );


            let nearest =
                projected[0];


            projected.forEach(point => {

                if (point.z > nearest.z) {
                    nearest = point;
                }


                const image =
                    loadedImages[point.itemIndex];


                const size =
                    115 *
                    point.scale;


                ctx.save();


                /* Fade images at back */

                ctx.globalAlpha =
                    Math.max(
                        0.18,
                        (point.z + 1.5) / 2.5
                    );


                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    size / 2,
                    0,
                    Math.PI * 2
                );

                ctx.clip();


                if (
                    image &&
                    image.complete
                ) {

                    ctx.drawImage(
                        image,
                        point.x - size / 2,
                        point.y - size / 2,
                        size,
                        size
                    );

                } else {

                    ctx.fillStyle =
                        "#5227ff";

                    ctx.fill();
                }


                ctx.restore();


                /* Circle border */

                ctx.save();

                ctx.beginPath();

                ctx.arc(
                    point.x,
                    point.y,
                    size / 2,
                    0,
                    Math.PI * 2
                );


                ctx.strokeStyle =
                    point.z > 0
                        ? "rgba(255,255,255,0.5)"
                        : "rgba(255,255,255,0.15)";


                ctx.lineWidth = 2;

                ctx.stroke();

                ctx.restore();
            });


            /* Update active card */

            updateActiveItem(
                nearest.itemIndex
            );
        }


        /* ==========================================
           ANIMATION
        ========================================== */

        function animate() {

            if (!isDragging) {

                rotationY +=
                    velocityY;

                rotationX +=
                    velocityX;


                velocityY *= 0.96;
                velocityX *= 0.96;


                if (
                    Math.abs(velocityY) < 0.0001
                ) {
                    velocityY = 0.002;
                }

            }


            drawSphere();

            requestAnimationFrame(
                animate
            );
        }


        /* ==========================================
           MOUSE CONTROLS
        ========================================== */

        canvas.addEventListener(
            "mousedown",
            function(event) {

                isDragging = true;

                previousX =
                    event.clientX;

                previousY =
                    event.clientY;


                velocityX = 0;
                velocityY = 0;
            }
        );


        window.addEventListener(
            "mousemove",
            function(event) {

                if (!isDragging) return;


                const deltaX =
                    event.clientX -
                    previousX;

                const deltaY =
                    event.clientY -
                    previousY;


                rotationY +=
                    deltaX * 0.008;

                rotationX +=
                    deltaY * 0.008;


                velocityY =
                    deltaX * 0.0008;

                velocityX =
                    deltaY * 0.0008;


                previousX =
                    event.clientX;

                previousY =
                    event.clientY;
            }
        );


        window.addEventListener(
            "mouseup",
            function() {

                isDragging = false;
            }
        );


        /* ==========================================
           TOUCH CONTROLS
        ========================================== */

        canvas.addEventListener(
            "touchstart",
            function(event) {

                isDragging = true;

                const touch =
                    event.touches[0];

                previousX =
                    touch.clientX;

                previousY =
                    touch.clientY;
            }
        );


        canvas.addEventListener(
            "touchmove",
            function(event) {

                if (!isDragging) return;

                const touch =
                    event.touches[0];


                const deltaX =
                    touch.clientX -
                    previousX;

                const deltaY =
                    touch.clientY -
                    previousY;


                rotationY +=
                    deltaX * 0.008;

                rotationX +=
                    deltaY * 0.008;


                previousX =
                    touch.clientX;

                previousY =
                    touch.clientY;

            }
        );


        canvas.addEventListener(
            "touchend",
            function() {

                isDragging = false;
            }
        );


        /* ==========================================
           BUTTON
        ========================================== */

        function goNext() {

            /*
              CHANGE THIS FILE NAME
              TO THE PAGE YOU WANT
            */

           window.location.href = "dashboard.html ";
        }

    </script>


</body>
</html>
