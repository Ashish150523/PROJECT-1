<body>

    <div class="pixel-swap" id="pixelSwap">

        <!-- SIGN UP -->
        <div class="container pixel-swap__layer" id="signup">

            <h1 class="form-title">Register</h1>

            <form id="signupForm">

                <div class="input-group">
                    <i class="fas fa-user"></i>

                    <input type="text" id="fName" placeholder="First Name" required>
                    <label for="fName">First Name</label>
                </div>

                <div class="input-group">
                    <i class="fas fa-user"></i>

                    <input type="text" id="lName" placeholder="Last Name" required>
                    <label for="lName">Last Name</label>
                </div>

                <div class="input-group">
                    <i class="fas fa-envelope"></i>

                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <label for="signupEmail">Email</label>
                </div>

                <div class="input-group">
                    <i class="fas fa-lock"></i>

                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <label for="signupPassword">Password</label>
                </div>

                <input type="submit" class="btn" value="Sign Up">

            </form>

            <p class="or">----------or----------</p>

            <div class="icons">
                <i class="fab fa-google"></i>
                <i class="fab fa-facebook"></i>
            </div>

            <div class="links">
                <p>Already Have Account?</p>

                <button type="button" id="signInButton">
                    Sign In
                </button>
            </div>

        </div>


        <!-- SIGN IN -->
        <div class="container pixel-swap__layer active" id="signIn">

            <h1 class="form-title">Sign In</h1>

            <form id="signInForm">

                <div class="input-group">
                    <i class="fas fa-envelope"></i>

                    <input
                        type="email"
                        id="signInEmail"
                        placeholder="Email"
                        required
                    >

                    <label for="signInEmail">Email</label>
                </div>


                <div class="input-group">
                    <i class="fas fa-lock"></i>

                    <input
                        type="password"
                        id="signInPassword"
                        placeholder="Password"
                        required
                    >

                    <label for="signInPassword">Password</label>
                </div>


                <p class="recover">
                    <a href="#">Recover Password</a>
                </p>


                <input
                    type="submit"
                    class="btn"
                    value="Sign In"
                >

            </form>


            <p class="or">----------or----------</p>


            <div class="icons">

                <a href="https://myaccount.google.com/" class="icon-link">
                    <i class="fab fa-google"></i>
                </a>

                <a href="#" class="icon-link">
                    <i class="fab fa-facebook"></i>
                </a>

            </div>


            <div class="links">

                <p>Don't have an account yet?</p>

                <button type="button" id="signUpButton">
                    Sign Up
                </button>

            </div>

        </div>

    </div>


    <!-- Pixel animation -->
    <div class="pixel-swap__grid" id="pixelGrid"></div>


    <!-- Firebase -->
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.2/firebase-database-compat.js"></script>

    <script src="script.js"></script>
    <script src="mail.js"></script>

</body>
